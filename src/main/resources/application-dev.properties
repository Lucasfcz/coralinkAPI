
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coralink}
spring.datasource.username=${DB_USERNAME:coralink}
spring.datasource.password=${DB_PASSWORD:coralink}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis Dev (Local via Docker)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=false

# Segredo JWT para dev (garante boot local imediato sem erros se JWT_SECRET não estiver exportado)
coralink.security.secret=${JWT_SECRET:dev-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-signing!}