spring.application.name=coralink


spring.profiles.active=${SPRING_PROFILES_ACTIVE}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations

# Gemini (Google AI Studio)
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

# Intervalo de execução do agendador do pipeline (12 horas = 43200000 ms)
coralink.scheduler.source-check-rate-ms=43200000

# Token público de Content Delivery do Storyblok (Porto Digital)
coralink.sources.porto-digital.token=${PORTO_DIGITAL_STORYBLOK_TOKEN:Tgr62GfKdVlaQrQerwtKtgtt}