spring.application.name=coralink


spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migrations

# Gemini (Google AI Studio)
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

# Intervalo de execução do agendador do pipeline (12 horas = 43200000 ms)
coralink.scheduler.source-check-rate-ms=43200000

# Token de Content Delivery do Storyblok (Porto Digital)
coralink.sources.porto-digital.token=${PORTO_DIGITAL_STORYBLOK_TOKEN:}

# CORS - Origens permitidas (separadas por vírgula)
coralink.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://coralink.vercel.app}

# Rate Limiting por IP (Bucket4j)
coralink.ratelimit.capacity=${RATE_LIMIT_CAPACITY:120}
coralink.ratelimit.refill-tokens=${RATE_LIMIT_REFILL_TOKENS:120}
coralink.ratelimit.refill-duration-minutes=${RATE_LIMIT_DURATION_MINUTES:1}

# Cache (Redis)
spring.cache.type=redis
spring.data.redis.timeout=2000ms

# Segurança, JWT & Google OAuth2
# Segredo HMAC-SHA256 para assinatura de Access Tokens (mínimo de 256 bits)
coralink.security.secret=${JWT_SECRET}
# Tempo de vida do Access Token (15 minutos = 900.000 ms)
coralink.security.access-token-expiration-ms=900000
# Tempo de vida do Refresh Token (7 dias = 604.800.000 ms)
coralink.security.refresh-token-expiration-ms=604800000
# Google OAuth2 Client ID registrado no Google Cloud Console
coralink.security.google-client-id=${GOOGLE_CLIENT_ID:}