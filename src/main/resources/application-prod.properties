spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Em produção, o Flyway é a única fonte da verdade de schema; ddl-auto deve ser validate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Redis Prod (Upstash via URL ou Host/Porta)
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.host=${REDIS_HOST:}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:${UPSTASH_REDIS_REST_TOKEN:}}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}

# Segurança em Produção: Variáveis obrigatórias sem fallback fraco
coralink.security.secret=${JWT_SECRET}
coralink.security.google-client-id=${GOOGLE_CLIENT_ID}